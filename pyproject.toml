[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gauge-data-quality"
version = "1.0.0"
description = "Data quality and validation engine for Genesis OSINT Ecosystem"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Genesis OSINT Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "genesis-core>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
