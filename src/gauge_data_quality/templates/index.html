<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAUGE — Data Quality & Integrity Scorecard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 90% 10%, rgba(16, 185, 129, 0.12) 0%, transparent 50%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .logo-title { font-size: 1.3rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label { color: var(--text-muted); }
        .info-val { font-weight: 600; text-align: right; }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">📊</div>
            <div>
                <div class="logo-title">GAUGE</div>
                <div class="logo-subtitle">Contrôle de Qualité & Fraîcheur des Données</div>
            </div>
        </div>
        <div class="badge">QUALITY SCORECARD ONLINE</div>
    </header>

    <div class="grid">
        <div class="card">
            <div class="card-title">Scorecard de Qualité</div>
            <div class="info-row"><span class="info-label">Jeu de Données</span><span class="info-val" id="gSet">-</span></div>
            <div class="info-row"><span class="info-label">Score Global</span><span class="info-val" id="gScore" style="color:#34d399;">-</span></div>
            <div class="info-row"><span class="info-label">Note Globale</span><span class="info-val" id="gGrade">-</span></div>
        </div>

        <div class="card">
            <div class="card-title">Indicateurs Détaillés</div>
            <div class="info-row"><span class="info-label">Taux d'Exhaustivité</span><span class="info-val" id="gComp">-</span></div>
            <div class="info-row"><span class="info-label">Indice de Fraîcheur</span><span class="info-val" id="gFresh">-</span></div>
            <div class="info-row"><span class="info-label">Taux de Validité de Format</span><span class="info-val" id="gVal">-</span></div>
        </div>
    </div>

    <script>
        async function analyserQualiteDonnees() {
            try {
                const response = await fetch('/api/v1/quality?dataset_name=flux_annonces_bodacc');
                const contract = await response.json();
                const r = contract.result;

                document.getElementById('gSet').textContent = r.dataset || '-';
                document.getElementById('gScore').textContent = `${(r.quality_score * 100).toFixed(0)}%`;
                document.getElementById('gGrade').textContent = r.overall_grade || 'A+';

                document.getElementById('gComp').textContent = `${r.completeness_percent}%`;
                document.getElementById('gFresh').textContent = `${(r.freshness_index * 100).toFixed(0)}%`;
                document.getElementById('gVal').textContent = `${r.validity_percent}%`;

            } catch (err) {
                console.error("Erreur lors du contrôle qualité Gauge.");
            }
        }

        window.onload = analyserQualiteDonnees;
    </script>
</body>
</html>
